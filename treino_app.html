<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VM Treino">
<meta name="theme-color" content="#0d0d0d">
<title>VM Treino</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1f1f1f;--border:#252525;
  --gold:#C9A55A;--gold-bg:rgba(201,165,90,0.12);--gold-border:rgba(201,165,90,0.3);
  --text:#f0ece3;--text2:#8a8680;--text3:#5a5652;
  --green:#4CAF82;--green-bg:rgba(76,175,130,0.12);
  --blue:#5B8FD4;--blue-bg:rgba(91,143,212,0.12);--blue-border:rgba(91,143,212,0.3);
  --red:#E05252;--orange:#E0954A;
  --radius:12px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px}
body{max-width:480px;margin:0 auto;padding-bottom:150px;overflow-x:hidden}

/* ── HEADER ── */
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 0}
.header-brand{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--gold)}
.header-right{text-align:right}
.header-day{font-size:13px;font-weight:600;color:var(--text)}
.header-date{font-size:11px;color:var(--text2);margin-top:1px}

/* ── NAV ── */
.nav{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:6px 0 10px;z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;
  cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;letter-spacing:0.5px;transition:color .15s}
.nav-item.active{color:var(--gold)}
.nav-icon{font-size:21px}

/* ── PAGES ── */
.page{display:none;padding:14px 16px}
.page.active{display:block}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}

/* ── SLEEP SELECTOR ── */
.sleep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.sleep-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 4px;text-align:center;cursor:pointer;transition:all .2s}
.sleep-btn-h{font-size:15px;font-weight:700;color:var(--text2)}
.sleep-btn-l{font-size:10px;color:var(--text3);margin-top:2px}
.sleep-btn.selected{border-color:var(--gold);background:var(--gold-bg)}
.sleep-btn.selected .sleep-btn-h{color:var(--gold)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;font-size:11px;font-weight:700;letter-spacing:.5px}
.badge-gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(76,175,130,.3)}
.badge-gray{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* ── ALERT ── */
.alert{border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;line-height:1.5;margin-bottom:10px}
.alert-gold{background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold)}
.alert-blue{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue)}
.alert-red{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:var(--red)}
.alert-orange{background:rgba(224,149,74,.1);border:1px solid rgba(224,149,74,.3);color:var(--orange)}

/* ── WARMUP ── */
.warmup-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.warmup-toggle-label{font-size:13px;font-weight:600}
.warmup-toggle-icon{font-size:16px;color:var(--text2);transition:transform .2s}
.warmup-toggle-icon.open{transform:rotate(180deg)}
.warmup-list{margin-top:10px;display:none}
.warmup-list.open{display:block}
.warmup-item{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.warmup-item:last-child{border-bottom:none}
.warmup-reps{color:var(--text2);font-size:12px}
.warmup-done{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;background:var(--bg3)}
.warmup-done.checked{background:var(--green);border-color:var(--green);color:#0d0d0d}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.section-title{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase}

/* ── EXERCISE CARD ── */
.ex-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin-bottom:8px}
.ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ex-name{font-size:14px;font-weight:600;line-height:1.3;flex:1;margin-right:8px}
.ex-note{font-size:11px;color:var(--text3);margin-top:2px}
.ex-prev{font-size:11px;color:var(--text2);white-space:nowrap}
.ex-pr{font-size:10px;background:var(--green-bg);color:var(--green);border:1px solid rgba(76,175,130,.3);
  border-radius:4px;padding:2px 5px;font-weight:700;margin-left:4px;vertical-align:middle}

/* ── SET ROWS ── */
.sets-head{display:grid;gap:5px;margin-bottom:5px;font-size:10px;font-weight:700;
  letter-spacing:.5px;color:var(--text3);text-align:center}
.sets-head.with-weight{grid-template-columns:32px 1fr 1fr 34px}
.sets-head.no-weight{grid-template-columns:32px 1fr 34px}
.set-row{display:grid;gap:5px;margin-bottom:5px;align-items:center}
.set-row.with-weight{grid-template-columns:32px 1fr 1fr 34px}
.set-row.no-weight{grid-template-columns:32px 1fr 34px}
.set-num{text-align:center;font-size:12px;color:var(--text3);font-weight:700}
.set-input{background:var(--bg2);border:1.5px solid var(--border);border-radius:6px;
  padding:9px 4px;text-align:center;font-size:16px;font-weight:700;color:var(--text);
  width:100%;font-family:var(--font);outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none}
.set-input:focus{border-color:var(--gold)}
.set-input:disabled{opacity:.25;pointer-events:none}
.set-input::placeholder{color:var(--text3);font-weight:400;font-size:14px}
.set-done{width:34px;height:34px;border-radius:6px;border:1.5px solid var(--border);
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;transition:all .2s}
.set-done.checked{background:var(--green);border-color:var(--green)}

/* ── REST TIMER ── */
.rest-timer{position:fixed;bottom:148px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:448px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  z-index:150;box-shadow:0 -4px 20px rgba(0,0,0,.4);
  transition:transform .3s,opacity .3s;transform:translateX(-50%) translateY(120px);opacity:0}
.rest-timer.visible{transform:translateX(-50%) translateY(0);opacity:1}
.rest-timer-label{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.5px}
.rest-timer-count{font-size:28px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.rest-timer-count.urgent{color:var(--orange)}
.rest-timer-count.done{color:var(--gold)}
.rest-timer-btns{display:flex;gap:6px}
.rest-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:7px 11px;font-size:13px;color:var(--text2);cursor:pointer;font-family:var(--font)}

/* ── OFF DAY ── */
.off-activities{display:flex;flex-direction:column;gap:8px}
.off-item{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px;
  background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border)}
.off-item-icon{font-size:20px;flex-shrink:0}

/* ── CARDIO INFO ── */
.cardio-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.cardio-title{font-size:13px;font-weight:600;margin-bottom:6px}
.cardio-detail{font-size:13px;color:var(--text2);line-height:1.5}
.cardio-week{font-size:13px;font-weight:700;color:var(--blue)}

/* ── NOTES ── */
textarea.notes-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:11px;color:var(--text);font-size:15px;
  font-family:var(--font);resize:none;outline:none;min-height:72px;line-height:1.5;
  transition:border-color .15s}
textarea.notes-input:focus{border-color:var(--gold)}
textarea.notes-input::placeholder{color:var(--text3)}

/* ── BUTTONS ── */
.btn-primary{width:100%;background:var(--gold);color:#0d0d0d;border:none;border-radius:var(--radius-sm);
  padding:15px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.5px;
  font-family:var(--font);transition:opacity .2s;margin-top:4px}
.btn-primary:active{opacity:.85}
.btn-secondary{width:100%;background:transparent;border:1px solid var(--border);color:var(--text2);
  border-radius:var(--radius-sm);padding:13px;font-size:14px;cursor:pointer;font-family:var(--font);margin-top:8px}

/* ── COMPLETE STATE ── */
.complete-card{text-align:center;padding:24px 16px}
.complete-icon{font-size:56px;margin-bottom:12px}
.complete-title{font-size:20px;font-weight:700;margin-bottom:6px}
.complete-sub{font-size:14px;color:var(--text2);line-height:1.5}

/* ── HISTÓRICO ── */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px}
.wday-name{font-size:10px;color:var(--text3);font-weight:600}
.wday-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;border:1.5px solid var(--border);
  background:var(--bg3);color:var(--text3)}
.wday-dot.done-forca{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.wday-dot.done-z2{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.wday-dot.done-off{background:var(--green-bg);border-color:rgba(76,175,130,.3);color:var(--green)}
.wday-dot.is-today{border-width:2px;border-color:var(--text2)}
.wday-dot.missed{opacity:.35}

.history-item{display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;gap:8px}
.history-item:last-child{border-bottom:none}
.history-main{font-size:14px;font-weight:600}
.history-sub{font-size:12px;color:var(--text2);margin-top:2px}
.history-right{text-align:right;flex-shrink:0}
.streak-num{font-size:52px;font-weight:800;color:var(--gold);line-height:1;text-align:center}
.streak-label{font-size:13px;color:var(--text2);text-align:center;margin-top:4px}

/* ── PROGRESS CHART ── */
.ex-prog{margin-bottom:16px}
.ex-prog-name{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-bars{display:flex;align-items:flex-end;gap:4px;height:56px}
.prog-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.prog-bar{width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:4px;opacity:.7}
.prog-bar.latest{opacity:1}
.prog-bar-val{font-size:10px;color:var(--text2)}
.prog-divider{height:1px;background:var(--border);margin:12px 0}

/* ── NUTRIÇÃO ── */
.meal-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px;margin-bottom:8px}
.meal-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.meal-title{font-size:14px;font-weight:600}
.meal-meta{font-size:12px;color:var(--text2)}
.meal-body{margin-top:10px;display:none}
.meal-body.open{display:block}
.meal-item{display:flex;justify-content:space-between;font-size:13px;
  padding:5px 0;border-bottom:1px solid var(--border);color:var(--text2)}
.meal-item:last-child{border-bottom:none}
.meal-item-name{flex:1}
.meal-item-qty{color:var(--text3);font-size:12px}
.meal-totals{display:flex;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.meal-macro{text-align:center;flex:1}
.meal-macro-val{font-size:14px;font-weight:700;color:var(--gold)}
.meal-macro-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

.supp-item{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border)}
.supp-item:last-child{border-bottom:none}
.supp-name{font-size:14px;font-weight:500}
.supp-dose{font-size:12px;color:var(--text2)}
.supp-check{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--bg3);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;transition:all .2s}
.supp-check.done{background:var(--green);border-color:var(--green)}

.ptn-display{text-align:center;padding:8px 0}
.ptn-number{font-size:44px;font-weight:800;color:var(--gold);line-height:1}
.ptn-label{font-size:12px;color:var(--text2);margin-top:3px}
.ptn-bar-bg{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:10px 0}
.ptn-bar-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .3s}
.ptn-sources{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.ptn-src-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;text-align:center;cursor:pointer;transition:all .15s}
.ptn-src-btn:active{border-color:var(--gold);background:var(--gold-bg)}
.ptn-src-name{font-size:12px;font-weight:600}
.ptn-src-val{font-size:11px;color:var(--text2);margin-top:2px}

/* ── PAGE TITLE ── */
.page-title{font-size:22px;font-weight:700;margin-bottom:2px}
.page-subtitle{font-size:13px;color:var(--text2);margin-bottom:16px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-brand">VM TREINO</div>
  <div class="header-right">
    <div class="header-day" id="hDay"></div>
    <div class="header-date" id="hDate"></div>
  </div>
</div>

<!-- PAGE: HOJE -->
<div class="page active" id="pageHoje">
  <div style="height:14px"></div>
  <div id="hojeContent"></div>
</div>

<!-- PAGE: HISTÓRICO -->
<div class="page" id="pageHistorico">
  <div style="height:14px"></div>
  <div class="page-title">Histórico</div>
  <div class="page-subtitle">Evolução semana a semana</div>

  <div class="card">
    <div class="card-label">Esta semana</div>
    <div class="week-strip" id="weekStrip"></div>
  </div>

  <div class="card">
    <div class="card-label">Sequência</div>
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-label">dias consecutivos</div>
  </div>

  <div class="card" id="progressCard" style="display:none">
    <div class="card-label">Evolução por exercício</div>
    <div id="progressContent"></div>
  </div>

  <div class="card">
    <div class="card-label">Sessões</div>
    <div id="sessionList"></div>
  </div>
</div>

<!-- PAGE: NUTRIÇÃO -->
<div class="page" id="pageNutricao">
  <div style="height:14px"></div>
  <div class="page-title">Nutrição</div>
  <div class="page-subtitle" id="nutSubtitle"></div>

  <div class="card">
    <div class="card-label">Proteína do dia</div>
    <div class="ptn-display">
      <div class="ptn-number" id="ptnNumber">0<span style="font-size:20px;color:var(--text2)">g</span></div>
      <div class="ptn-label">meta: 150–170g</div>
    </div>
    <div class="ptn-bar-bg"><div class="ptn-bar-fill" id="ptnBar" style="width:0%"></div></div>
    <div class="ptn-sources" id="ptnSources"></div>
  </div>

  <div class="card">
    <div class="card-label">Suplementos de hoje</div>
    <div id="suppList"></div>
  </div>

  <div id="mealsContainer"></div>
</div>

<!-- REST TIMER -->
<div class="rest-timer" id="restTimer">
  <div>
    <div class="rest-timer-label">DESCANSO</div>
    <div class="rest-timer-count" id="restCount">1:30</div>
  </div>
  <div class="rest-timer-btns">
    <button class="rest-btn" onclick="addRestTime(30)">+30s</button>
    <button class="rest-btn" onclick="skipRest()">Pular</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-item active" onclick="showPage('hoje')">
    <div class="nav-icon">⚡</div>HOJE
  </div>
  <div class="nav-item" onclick="showPage('historico')">
    <div class="nav-icon">📊</div>HISTÓRICO
  </div>
  <div class="nav-item" onclick="showPage('nutricao')">
    <div class="nav-icon">🥩</div>NUTRIÇÃO
  </div>
</nav>

<script>
// ══════════════════════════════════════════════════
// DATA — WARMUP (TODAS AS SESSÕES DE FORÇA)
// ══════════════════════════════════════════════════
const WARMUP = [
  { name: "Face pulls com elástico", reps: "2×15" },

  { name: "Dead bugs (lento)",       reps: "2×8 cada lado" },
  { name: "Scapular push-ups",       reps: "2×10" },

  lower: {

    warning: "⚠️ Sem HIIT após perna. Z2 apenas se quiser cardio.",
    main: [
      { id:"leg_press",        name:"Leg Press",                  sets:4, repsLabel:"10",                 w:true  },
      { id:"stiff",            name:"Stiff",                      sets:4, repsLabel:"8",                  w:true  },
      { id:"mesa_flexora",     name:"Mesa Flexora",               sets:3, repsLabel:"12",                 w:true  },
      { id:"cadeira_ext",      name:"Cadeira Extensora",          sets:3, repsLabel:"12",   note:"1s no topo", w:true  },
      { id:"panturrilha",      name:"Panturrilha",                sets:4, repsLabel:"12–15",               w:true  },

let db = { sessions:[], programStart: null };
let currentSession = null;
let restTimerInterval = null;
let restSeconds = 0;

function loadDB() {
  try {
    const s = localStorage.getItem('vm_treino_v2');
    if (s) db = JSON.parse(s);
    if (!db.programStart) { db.programStart = getTodayKey(); saveDB(); }
  } catch(e) { db = { sessions:[], programStart: getTodayKey() }; }
}
function saveDB() {
  localStorage.setItem('vm_treino_v2', JSON.stringify(db));
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function getCurrentWeek() {
  if (!db.programStart) return 1;
  const start = new Date(db.programStart);
  const today = new Date();
  const days = Math.max(0, Math.floor((today - start) / 86400000));
  return Math.min(4, Math.floor(days / 7) + 1);
}

function getTodaySession() {
  return db.sessions.find(s => s.date === getTodayKey());
}

function getLastSessionOf(workoutType) {
  return db.sessions
    .filter(s => s.workoutType === workoutType && s.completed)
    .sort((a,b) => b.date.localeCompare(a.date))[0];
}

function getPrevMax(workoutType, exId) {
  const prev = getLastSessionOf(workoutType);
  if (!prev) return null;
  const ex = prev.exercises && prev.exercises.find(e => e.id === exId);
  if (!ex) return null;
  const weights = ex.sets.filter(s => s.done && s.weight > 0).map(s => s.weight);
  return weights.length ? Math.max(...weights) : null;
}

function selectSleep(hours, el) {
  document.querySelectorAll('.sleep-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const dow = new Date().getDay();
  const baseType = DAY_SCHEDULE[dow];
  const workout = WORKOUTS[baseType];
  let workoutType = baseType;
  let seriesReduction = 0;
  let override = null;

  if (hours < 4) {
    override = 'nsdr';
  } else if (hours < 5) {
    override = 'z2_light';
  } else if (hours < 6 && workout && !workout.type) {
    seriesReduction = 1;
  }

  currentSession = {
    date: getTodayKey(),
    sleep: hours,
    dayOfWeek: dow,
    workoutType: override || workoutType,
    baseType,
    seriesReduction,
    exercises: buildExercises(override || workoutType, seriesReduction),
    warmupDone: [],
    notes: '',
    completed: false,
    startedAt: new Date().toISOString(),
  };

  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  db.sessions.push(currentSession);
  saveDB();
  renderWorkoutContent(currentSession);
}

function buildExercises(workoutType, reduction) {
  const w = WORKOUTS[workoutType];
  if (!w || w.type === 'off') return [];
  const all = [...(w.main || []), ...(w.core || [])];
  return all.map(ex => ({
    id: ex.id,
    name: ex.name,
    repsLabel: ex.repsLabel,
    note: ex.note || null,
    hasWeight: ex.w,
    isCore: (w.core || []).includes(ex),
    isSeg: ex.seg || false,
    unit: ex.unit || null,
    sets: Array.from({ length: Math.max(1, ex.sets - reduction) }, () => ({
      reps: '', weight: '', done: false
    }))
  }));
}

  mainExs.forEach((ex, i) => { html += renderExerciseCard(ex, i, wt); });

  html += `<div class="section-header"><div class="section-title">Core</div></div>`;
  coreExs.forEach((ex, i) => { html += renderExerciseCard(ex, mainExs.length + i, wt); });

  // Cardio
  if (w.cardio) {
    const dur = w.cardio.weekly ? w.cardio.weekly[week] || w.cardio.weekly["4"] : '';
    html += `
      <div class="section-header"><div class="section-title">Cardio</div>
        ${dur ? `<span class="badge badge-blue">Sem ${week} — ${dur}</span>` : ''}
      </div>
      <div class="cardio-box" style="margin-bottom:10px">
        <div class="cardio-title">${w.cardio.label}</div>
        <div class="cardio-detail">${w.cardio.protocol || ''}
          ${dur ? `<br><strong style="color:var(--blue)">${dur}</strong>` : ''}
        </div>
      </div>`;
  }

  // Notes + button
  html += `
    <div class="card" style="margin-top:8px">
      <div class="card-label">Observações</div>
      <textarea class="notes-input" placeholder="Como foi? Dores, ajustes, sensações..."
        oninput="updateNotes(this.value)">${session.notes || ''}</textarea>
    </div>
    <button class="btn-primary" onclick="completeSession()">Finalizar treino ✓</button>
    <div style="height:8px"></div>`;

  cont.innerHTML = html;

  // Restore warmup state
  (session.warmupDone || []).forEach(i => {
    const el = document.getElementById(`wd-${i}`);
    if (el) { el.classList.add('checked'); el.textContent = '✓'; }
  });
}

function renderExerciseCard(ex, globalIdx, workoutType) {
  const prevMax = getPrevMax(workoutType, ex.id);
  const hasW = ex.hasWeight;
  const gridClass = hasW ? 'with-weight' : 'no-weight';
  const cols = hasW ? 'SET|REPS|KG|✓' : 'SET|REPS|✓';

  let html = `<div class="ex-card">
    <div class="ex-header">
      <div>
        <div class="ex-name">${ex.name}</div>
        ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
      </div>
      ${prevMax ? `<div class="ex-prev">${prevMax}kg</div>` : ''}
    </div>
    <div class="sets-head ${gridClass}">
      ${cols.split('|').map(c=>`<div>${c}</div>`).join('')}
    </div>`;

  ex.sets.forEach((set, si) => {
    html += `<div class="set-row ${gridClass}" id="sr-${globalIdx}-${si}">
      <div class="set-num">${si+1}</div>
      <input type="number" inputmode="decimal" class="set-input"
        value="${set.reps}" placeholder="${ex.repsLabel}"
        oninput="updateSet(${globalIdx},${si},'reps',this.value)">
      ${hasW ? `<input type="number" inputmode="decimal" class="set-input"
        value="${set.weight}" placeholder="${ex.unit||'kg'}"
        oninput="updateSet(${globalIdx},${si},'weight',this.value)">` : ''}
      <div class="set-done${set.done?' checked':''}" id="sd-${globalIdx}-${si}"
        onclick="toggleSetDone(${globalIdx},${si})">
        ${set.done?'✓':''}
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function toggleWarmup() {
  const list = document.getElementById('warmupList');
  const icon = document.getElementById('warmupIcon');
  list.classList.toggle('open');
  icon.classList.toggle('open');
}

function toggleWarmupItem(idx) {
  const el = document.getElementById(`wd-${idx}`);
  if (!currentSession) return;
  const done = currentSession.warmupDone || [];
  if (done.includes(idx)) {
    currentSession.warmupDone = done.filter(i => i !== idx);
    el.classList.remove('checked'); el.textContent = '';
  } else {
    currentSession.warmupDone = [...done, idx];
    el.classList.add('checked'); el.textContent = '✓';
  }
  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  db.sessions.push(currentSession);
  saveDB();
}

function updateSet(exIdx, setIdx, field, value) {
  if (!currentSession || !currentSession.exercises[exIdx]) return;
  currentSession.exercises[exIdx].sets[setIdx][field] = value;
  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  db.sessions.push(currentSession);
  saveDB();
}

function toggleSetDone(exIdx, setIdx) {
  if (!currentSession || !currentSession.exercises[exIdx]) return;
  const set = currentSession.exercises[exIdx].sets[setIdx];
  set.done = !set.done;
  const el = document.getElementById(`sd-${exIdx}-${setIdx}`);
  if (set.done) {
    el.classList.add('checked'); el.textContent = '✓';
    startRestTimer(90);
    if (navigator.vibrate) navigator.vibrate(40);
  } else {
    el.classList.remove('checked'); el.textContent = '';
  }
  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  db.sessions.push(currentSession);
  saveDB();
}

function updateNotes(val) {
  if (!currentSession) return;
  currentSession.notes = val;
  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  db.sessions.push(currentSession);
  saveDB();
}

function completeSession() {
  if (!currentSession) return;
  currentSession.completed = true;
  currentSession.completedAt = new Date().toISOString();
  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  db.sessions.push(currentSession);
  saveDB();
  stopRestTimer();
  renderCompleted(currentSession);
}

function renderCompleted(session) {
  const wt = session.workoutType;
  const w = WORKOUTS[wt];
  const doneCount = (session.exercises || []).reduce((a,e) => a + e.sets.filter(s=>s.done).length, 0);
  const totalCount = (session.exercises || []).reduce((a,e) => a + e.sets.length, 0);
  let sub = '';
  if (w && !w.type) {
    sub = `${w.name} — ${w.sub}<br>${doneCount} de ${totalCount} séries concluídas`;
  } else {
    sub = w ? `${w.name} — ${w.sub}` : 'Treino registrado';
  }

  document.getElementById('hojeContent').innerHTML = `
    <div class="card complete-card">
      <div class="complete-icon">✅</div>
      <div class="complete-title">Treino concluído.</div>
      <div class="complete-sub">${sub}</div>
    </div>
    ${session.notes ? `<div class="card"><div class="card-label">Suas notas</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.6">${session.notes}</div></div>` : ''}
    <button class="btn-secondary" onclick="resetToday()">Editar treino de hoje</button>
    <div style="height:8px"></div>`;
}

function resetToday() {
  db.sessions = db.sessions.filter(s => s.date !== getTodayKey());
  saveDB();
  currentSession = null;
  renderSleepCheck();
}

// ══════════════════════════════════════════════════
// REST TIMER
// ══════════════════════════════════════════════════
function startRestTimer(seconds) {
  stopRestTimer();
  restSeconds = seconds;
  const timer = document.getElementById('restTimer');
  timer.classList.add('visible');
  updateRestDisplay();
  restTimerInterval = setInterval(() => {
    restSeconds--;
    updateRestDisplay();
    if (restSeconds <= 0) {
      stopRestTimer();
      if (navigator.vibrate) navigator.vibrate([100,50,100]);
    }
  }, 1000);
}

function updateRestDisplay() {
  const el = document.getElementById('restCount');
  const m = Math.floor(Math.abs(restSeconds) / 60);
  const s = Math.abs(restSeconds) % 60;
  el.textContent = `${m}:${pad(s)}`;
  el.className = 'rest-timer-count' + (restSeconds <= 0 ? ' done' : restSeconds < 15 ? ' urgent' : '');
}

function addRestTime(sec) { restSeconds += sec; updateRestDisplay(); }

function skipRest() { stopRestTimer(); }

function stopRestTimer() {
  clearInterval(restTimerInterval);
  document.getElementById('restTimer').classList.remove('visible');
  restSeconds = 0;
}

// ══════════════════════════════════════════════════
// HISTÓRICO
// ══════════════════════════════════════════════════
function renderHistorico() {
  renderWeekStrip();
  renderStreak();
  renderProgress();
  renderSessionList();
}

function renderWeekStrip() {
  const today = new Date();
  const dow = today.getDay();
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = DAY_PT.map((d, i) => {
    const diff = i - dow;
    const date = new Date(today);
    date.setDate(today.getDate() + diff);
    const key = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    const session = db.sessions.find(s => s.date === key && s.completed);
    const isToday = i === dow;
    const isPast = date < today && !isToday;
    let dotClass = 'wday-dot', dotContent = date.getDate();

    if (session) {
      const wt = session.workoutType;
      const w = WORKOUTS[wt];
      if (w && !w.type) { dotClass += ' done-forca'; dotContent = w.emoji; }
      else if (w && w.type === 'off') { dotClass += ' done-off'; dotContent = '✓'; }
      else { dotClass += ' done-z2'; dotContent = '🚶'; }
    } else if (isPast) {
      dotClass += ' missed';
    }
    if (isToday) dotClass += ' is-today';

    return `<div class="wday"><div class="wday-name">${d}</div>
      <div class="${dotClass}">${dotContent}</div></div>`;
  }).join('');
}

function renderStreak() {
  let streak = 0;
  const check = new Date();
  while (true) {
    const key = `${check.getFullYear()}-${pad(check.getMonth()+1)}-${pad(check.getDate())}`;
    if (db.sessions.find(s => s.date === key && s.completed)) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else break;
  }
  document.getElementById('streakNum').textContent = streak;
}

function renderProgress() {
  const card = document.getElementById('progressCard');
  const cont = document.getElementById('progressContent');
  const strengthSessions = db.sessions.filter(s => s.completed && s.exercises && s.exercises.length);
  if (strengthSessions.length < 2) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const exMap = {};
  strengthSessions.sort((a,b) => a.date.localeCompare(b.date)).forEach(sess => {
    (sess.exercises || []).forEach(ex => {
      if (!ex.hasWeight) return;
      const weights = ex.sets.filter(s => s.done && parseFloat(s.weight) > 0).map(s => parseFloat(s.weight));
      if (!weights.length) return;
      const max = Math.max(...weights);
      if (!exMap[ex.name]) exMap[ex.name] = [];
      exMap[ex.name].push({ date: sess.date, max });
    });
  });

  const entries = Object.entries(exMap).filter(([,data]) => data.length >= 2);
  if (!entries.length) { card.style.display = 'none'; return; }

  cont.innerHTML = entries.map(([name, data]) => {
    const last5 = data.slice(-5);
    const maxVal = Math.max(...last5.map(d => d.max));
    const latest = last5[last5.length - 1];
    const prev = last5[last5.length - 2];
    const diff = prev ? (latest.max - prev.max).toFixed(1) : null;
    const diffStr = diff !== null ? `<span style="color:${diff >= 0 ? 'var(--green)' : 'var(--red)'}"> ${diff >= 0 ? '+' : ''}${diff}kg</span>` : '';

    return `<div class="ex-prog">
      <div class="ex-prog-name">
        ${name}
        <div><strong style="color:var(--gold)">${latest.max}kg</strong>${diffStr}</div>
      </div>
      <div class="prog-bars">
        ${last5.map((d,i) => {
          const h = maxVal > 0 ? Math.max(8, Math.round((d.max / maxVal) * 100)) : 8;
          const isLatest = i === last5.length - 1;
          return `<div class="prog-bar-wrap">
            <div class="prog-bar${isLatest?' latest':''}" style="height:${h}%"></div>
            <div class="prog-bar-val">${d.max}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="prog-divider"></div>
    </div>`;
  }).join('');
}

function renderSessionList() {
  const cont = document.getElementById('sessionList');
  const sorted = [...db.sessions].filter(s => s.completed).sort((a,b) => b.date.localeCompare(a.date)).slice(0,20);
  if (!sorted.length) {
    cont.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text3)">Nenhum treino registrado ainda.</div>`;
    return;
  }
  cont.innerHTML = sorted.map(s => {
    const w = WORKOUTS[s.workoutType];
    const name = w ? `${w.emoji} ${w.name} — ${w.sub}` : s.workoutType;
    const sets = s.exercises ? s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0) : null;
    return `<div class="history-item">
      <div>
        <div class="history-main">${name}</div>
        <div class="history-sub">${formatDateFull(s.date)}${sets ? ` · ${sets} séries` : ''}</div>
      </div>
      <div class="history-right">
        <span class="badge badge-gray" style="font-size:10px">${s.sleep}h sono</span>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════
// NUTRIÇÃO
// ══════════════════════════════════════════════════
function renderNutricao() {
  const dow = new Date().getDay();
  const dayData = MEALS_BY_DAY[dow];
  document.getElementById('nutSubtitle').textContent = dayData ? dayData.label : '';

  renderSupplements();
  renderProtein();
  renderMeals(dow);
}

function renderSupplements() {
  const key = getTodayKey();
  const done = JSON.parse(localStorage.getItem(`vm_supp_${key}`) || '[]');
  document.getElementById('suppList').innerHTML = SUPPLEMENTS.map(s => `
    <div class="supp-item">
      <div><div class="supp-name">${s.name}</div><div class="supp-dose">${s.dose}</div></div>
      <div class="supp-check${done.includes(s.id)?' done':''}" id="supp-${s.id}"
        onclick="toggleSupp('${s.id}')">
        ${done.includes(s.id)?'✓':''}
      </div>
    </div>`).join('');
}

function toggleSupp(id) {
  const key = getTodayKey();
  const done = JSON.parse(localStorage.getItem(`vm_supp_${key}`) || '[]');
  const updated = done.includes(id) ? done.filter(x=>x!==id) : [...done, id];
  localStorage.setItem(`vm_supp_${key}`, JSON.stringify(updated));
  renderSupplements();
}

function renderProtein() {
  const key = getTodayKey();
  const total = parseInt(localStorage.getItem(`vm_ptn_${key}`) || '0');
  document.getElementById('ptnNumber').innerHTML = `${total}<span style="font-size:20px;color:var(--text2)">g</span>`;
  const pct = Math.min(100, Math.round((total / 160) * 100));
  document.getElementById('ptnBar').style.width = pct + '%';
  document.getElementById('ptnSources').innerHTML = PTN_SOURCES.map(s => `
    <div class="ptn-src-btn" onclick="addProtein(${s.g})">
      <div class="ptn-src-name">${s.name}</div>
      <div class="ptn-src-val">+${s.g}g</div>
    </div>`).join('');
}

function addProtein(g) {
  const key = getTodayKey();
  const total = parseInt(localStorage.getItem(`vm_ptn_${key}`) || '0') + g;
  localStorage.setItem(`vm_ptn_${key}`, total);
  renderProtein();
  if (navigator.vibrate) navigator.vibrate(20);
}

function renderMeals(dow) {
  const dayData = MEALS_BY_DAY[dow];
  if (!dayData) return;
  document.getElementById('mealsContainer').innerHTML = dayData.meals.map((meal, i) => `
    <div class="meal-card">
      <div class="meal-header" onclick="toggleMeal(${i})">
        <div>
          <div class="meal-title">${meal.title}</div>
          ${meal.ptn > 0 ? `<div class="meal-meta">${meal.ptn}g ptn · ${meal.kcal} kcal</div>` : ''}
        </div>
        <span style="color:var(--text3);font-size:14px" id="meal-icon-${i}">▼</span>
      </div>
      <div class="meal-body" id="meal-body-${i}">
        ${meal.items.map(([name,qty]) => `
          <div class="meal-item">
            <span class="meal-item-name">${name}</span>
            <span class="meal-item-qty">${qty}</span>
          </div>`).join('')}
        ${meal.ptn > 0 ? `
          <div class="meal-totals">
            <div class="meal-macro"><div class="meal-macro-val">${meal.ptn}g</div><div class="meal-macro-lbl">Proteína</div></div>
            <div class="meal-macro"><div class="meal-macro-val">${meal.kcal}</div><div class="meal-macro-lbl">kcal</div></div>
          </div>` : ''}
      </div>
    </div>`).join('');
}

function toggleMeal(i) {
  const body = document.getElementById(`meal-body-${i}`);
  const icon = document.getElementById(`meal-icon-${i}`);
  body.classList.toggle('open');
  icon.textContent = body.classList.contains('open') ? '▲' : '▼';
}

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
function formatDateFull(key) {
  const [y,m,d] = key.split('-').map(Number);
  const date = new Date(y, m-1, d);
  return `${DAY_PT[date.getDay()]}, ${d} ${MONTH_PT[m-1]}`;
}
function formatDateShort(key) {
  const [y,m,d] = key.split('-').map(Number);
  return `${d} ${MONTH_PT[m-1]}`;
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
function init() {
  loadDB();
  const now = new Date();
  document.getElementById('hDay').textContent = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][now.getDay()];
  document.getElementById('hDate').textContent = `${now.getDate()} ${MONTH_PT[now.getMonth()]} ${now.getFullYear()}`;
  renderHoje();
}

init();
</script>
</body>
